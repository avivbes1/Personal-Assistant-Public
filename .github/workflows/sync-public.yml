name: Sync to Public Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: PII Scan + Sync to Public
    runs-on: ubuntu-latest
    # Only run after CI passes
    needs: []
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PII Scan
        run: node scripts/detect-pii.js src/

      - name: Push to public repo
        run: |
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/avivbes1/Personal-Assistant-Public.git
          git push public HEAD:main --force
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
