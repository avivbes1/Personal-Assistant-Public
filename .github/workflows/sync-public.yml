name: Sync to Public Repo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  sync:
    name: PII scan + publish to Personal-Assistant-Public
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PII scan — src/
        run: node scripts/detect-pii.js src/

      - name: PII scan — prompts/
        run: node scripts/detect-pii.js prompts/

      - name: Build public snapshot
        run: |
          bash scripts/prepare-public-release.sh ${{ github.workspace }}/pa-public-snapshot

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: avivbes1/Personal-Assistant-Public
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: pa-public-repo
          fetch-depth: 0

      - name: Build commit message from private repo history
        id: commit-msg
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          # Find the last synced SHA (stored in public repo's .sync-sha)
          LAST_SHA=""
          if [ -f pa-public-repo/.sync-sha ]; then
            LAST_SHA=$(cat pa-public-repo/.sync-sha)
          fi

          # Collect commit subjects since last sync
          if [ -n "$LAST_SHA" ] && git cat-file -t "$LAST_SHA" >/dev/null 2>&1; then
            RAW_MSG=$(git log --format='- %s' "${LAST_SHA}..${HEAD_SHA}" -- | head -20)
          else
            # First sync or unknown base — use the head commit message
            RAW_MSG=$(git log --format='- %s' -1 "$HEAD_SHA")
          fi

          # PII-sanitize the commit messages
          CLEAN_MSG=$(echo "$RAW_MSG" | node scripts/sanitize-commit-msg.js)

          # Format: multi-line for multiple commits, single line for one
          LINE_COUNT=$(echo "$CLEAN_MSG" | wc -l)
          if [ "$LINE_COUNT" -gt 1 ]; then
            TITLE=$(printf "Sync %d commits from private repo" "$LINE_COUNT")
          else
            # Single commit — use the message directly (strip leading "- ")
            TITLE=$(echo "$CLEAN_MSG" | sed 's/^- //')
          fi

          # Export for next step (handle multiline safely)
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          {
            echo "title<<${EOF_MARKER}"
            echo "$TITLE"
            echo "${EOF_MARKER}"
            echo "body<<${EOF_MARKER}_B"
            echo "$CLEAN_MSG"
            echo "${EOF_MARKER}_B"
            echo "sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Sync snapshot to public repo
        run: |
          find pa-public-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a pa-public-snapshot/ pa-public-repo/
          # Inject clean public-only CI workflow (no sync job)
          mkdir -p pa-public-repo/.github/workflows
          cp scripts/public-workflows/ci.yml pa-public-repo/.github/workflows/ci.yml

      - name: Commit and push to public repo
        run: |
          cd pa-public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Store the synced SHA for next run
          echo "${{ steps.commit-msg.outputs.sha }}" > .sync-sha

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            COMMIT_TITLE="${{ steps.commit-msg.outputs.title }}"
            COMMIT_BODY="${{ steps.commit-msg.outputs.body }}"
            if [ $(echo "$COMMIT_BODY" | wc -l) -gt 1 ]; then
              git commit -m "$COMMIT_TITLE" -m "$COMMIT_BODY"
            else
              git commit -m "$COMMIT_TITLE"
            fi
            git push
            echo "✅ Public repo updated."
          fi
