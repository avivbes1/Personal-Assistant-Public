name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pii-scan:
    name: PII Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan src/ for PII
        run: node scripts/detect-pii.js src/
      - name: Scan prompts/ for PII
        run: node scripts/detect-pii.js prompts/

  eval-validate:
    name: Eval Dataset Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Dry-run validates dataset structure only — no LLM calls, no tokens spent,
      # no secrets required. (Duplicate IDs currently warn; add --strict here to
      # enforce a fully deduplicated dataset once it has been cleaned.)
      - name: Validate eval dataset
        run: node tests/eval/run-eval.js --dry-run

  eval-gate:
    name: Eval Gate (live LLM)
    runs-on: ubuntu-latest
    # PRs only — the live eval spends tokens, so we don't run it on every push.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Fork PRs don't get repo secrets, so ANTHROPIC_API_KEY is empty there.
      # Skip (green) rather than fail red for contributors who can't run it.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not available (fork PR?) — skipping eval gate."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
      # Gold-only subset (40 rows, ~$0.06) through the M3 three-way gate:
      # pipeline accuracy, multilabel action accuracy, send_now recall.
      # run-eval.js exits non-zero if any gate fails → the job goes red.
      - name: Run eval gate (gold subset)
        if: steps.key.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIMEZONE: "UTC"
        run: node tests/eval/run-eval.js --gold-only --limit 40

  test:
    name: Tests (mock LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # H5 / P-014: pins the whatsapp-web.js compatibility surface of
      # src/baileys-client.js. Pure fixtures — no API calls, no secrets.
      - name: Run Baileys shim fixture suite
        run: node tests/shim/run.js
      - name: Run regression tests
        run: node tests/run-all.js
        env:
          LLM_PROVIDER: mock
          NODE_ENV: test
          CI: true
          AVIV_PHONE: "10000000000"
          LIAT_PHONE: "10000000001"
          MASTER_GROUP_NAME: "Test Family Group"
          MASTER_GROUP_JID: "000000000000000000@g.us"
          AVIV_CALENDAR_ID: "test-parent1@example.com"
          LIAT_CALENDAR_ID: "test-parent2@example.com"
          TIMEZONE: "UTC"
          ANTHROPIC_API_KEY: "sk-ant-test-not-real"
